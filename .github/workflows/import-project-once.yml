name: HellRun import trigger test

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  test-trigger:
    if: github.event.pull_request.title == 'RUN HELLRUN IMPORT'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prove same-repo workflow can write
        run: |
          mkdir -p .import
          printf 'GitHub Actions trigger confirmed.\n' > .import/action-trigger-confirmed.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .import/action-trigger-confirmed.txt
          git commit -m "Confirm HellRun import trigger"
          git push origin main
